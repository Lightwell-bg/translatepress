; Non-secret constants. Secrets live in .env. Path can be overridden with env CONFIG_INI.

[deepseek]
base_url = https://api.deepseek.com
model = deepseek-flash
timeout_seconds = 60
max_output_tokens = 32000

[pricing]
; USD per 1M tokens at peak time
peak_cache_hit = 0.006
peak_cache_miss = 0.30
peak_output = 1.20
; multiplier outside the peak windows and on weekends
offpeak_multiplier = 0.5
; UTC windows, Monday-Friday only
peak_windows = 01:00-04:00,06:00-10:00

[limits]
max_items = 300
max_chars_per_request = 20000
max_chars_per_item = 10000
max_body_bytes = 262144
max_glossary_entries = 50
; total glossary size (keys + values, characters); also capped at 2x the item text + 200
glossary_max_chars = 2000
per_site_requests_per_minute = 30
max_in_flight_per_account = 2
reservation_ttl_seconds = 300
; overall time budget for all provider calls of one request (incl. the follow-up call);
; must be at least 30 s below reservation_ttl_seconds, otherwise the sweeper could release a live request
call_deadline_seconds = 150
max_replays = 2
max_attempts = 3
sweeper_interval_seconds = 60

[plans]
; plan = characters per month : max sites
starter = 100000:1
pro = 500000:3
business = 1500000:10

[packs]
; pack name = characters
pack_250k = 250000
pack_1m = 1000000
